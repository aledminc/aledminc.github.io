<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Shares the placeholder logo; swap public/assets/logo.svg and both the
         favicon and the nav mark update together. -->
    <link rel="icon" type="image/svg+xml" href="/assets/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Xander Minch — personal portfolio, projects, and availability."
    />
    <title>Xander Minch</title>

    <!-- Three type roles, see index.css:
         Archivo (variable, width axis) — headlines, set EXPANDED like signage
         IBM Plex Sans                  — body prose
         Anonymous Pro                  — data, labels, the nav wordmark -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..900&family=IBM+Plex+Sans:wght@400;500;600;700&family=Anonymous+Pro:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <!-- Handwriting faces for typed signatures on the collage board. One is
         picked at random per signature, so all four can appear in a session. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&family=Kalam:wght@400;700&family=Shadows+Into+Light&family=Reenie+Beanie&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
