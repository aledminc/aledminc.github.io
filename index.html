<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Shares the mark with the nav; swap public/assets/logo.svg and both the
         favicon and the nav logo update together. -->
    <link rel="icon" type="image/svg+xml" href="/assets/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Matches --bone, so the browser chrome blends into the page ground. -->
    <meta name="theme-color" content="#ecead9" />
    <meta
      name="description"
      content="Xander Minch — systems that sense and decide. Projects, trajectory, and availability."
    />
    <title>Xander Minch</title>

    <!-- Three type roles, see index.css:
         Space Grotesk  — every headline; geometric and slightly technical
         Inter          — reading copy
         JetBrains Mono — data only: times, counts, codes, labels -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
