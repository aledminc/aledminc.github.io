<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Shares the placeholder logo; swap public/assets/logo.svg and both the
         favicon and the nav mark update together. -->
    <link rel="icon" type="image/svg+xml" href="/assets/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Xander Minch — personal portfolio, projects, and availability."
    />
    <title>Xander Minch</title>

    <!-- Anonymous Pro = display face (logo wordmark + headings), Inter = body.
         Anonymous Pro ships only 400 and 700, so headings use 700.
         Swap --font-display / --font-body in index.css to change. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anonymous+Pro:ital,wght@0,400;0,700;1,400;1,700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
