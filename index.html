<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Shares the mark with the nav; swap public/assets/logo.svg and both the
         favicon and the nav logo update together. -->
    <link rel="icon" type="image/svg+xml" href="/assets/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Matches --bone, so the browser chrome blends into the page ground. -->
    <meta name="theme-color" content="#ecead9" />
    <meta
      name="description"
      content="Xander Minch — systems that sense and decide. Projects, trajectory, and availability."
    />
    <link rel="canonical" href="https://aledminc.github.io/" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://aledminc.github.io/" />
    <meta property="og:title" content="Xander Minch — Systems that sense and decide" />
    <meta property="og:description" content="Computer science, AI/ML systems, research, and autonomous robotics." />
    <meta property="og:image" content="https://aledminc.github.io/assets/og-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Xander Minch — Systems that sense and decide" />
    <meta name="twitter:description" content="Computer science, AI/ML systems, research, and autonomous robotics." />
    <meta name="twitter:image" content="https://aledminc.github.io/assets/og-card.png" />
    <title>Xander Minch — Systems that sense and decide</title>

    <!-- Three type roles, see index.css:
         Space Grotesk  — every headline; geometric and slightly technical
         Inter          — reading copy
         JetBrains Mono — data only: times, counts, codes, labels -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <!-- Handwriting faces for typed signatures on the sheet. One is picked at
         random per signature, so all four can appear in a session. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&family=Kalam:wght@400;700&family=Shadows+Into+Light&family=Reenie+Beanie&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
